<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NB logo</title>
  <desc id="desc">Nick Burdo monogram logo with transparent background</desc>

  <defs>
    <linearGradient id="blueGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dabff"/>
      <stop offset="55%" stop-color="#5b8def"/>
      <stop offset="100%" stop-color="#3f73d8"/>
    </linearGradient>
  </defs>

  <!-- Transparent background by default -->
  <circle cx="256" cy="256" r="256" fill="#f4a261"/>
  <circle cx="256" cy="256" r="240" fill="#ffffff"/>
  <circle cx="256" cy="256" r="228" fill="url(#blueGradient)"/>

  <text
    x="256"
    y="286"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="210"
    font-weight="500"
    letter-spacing="-20"
    fill="#ffffff">NB</text>
</svg>
